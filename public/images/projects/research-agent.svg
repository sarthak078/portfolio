</defs>
<style>
  .flow{stroke-dasharray:6 9;animation:dash 1.4s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-30}}
  .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{50%{opacity:.35}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  .scan{animation:scan 3.6s ease-in-out infinite}
  @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(250px)}100%{transform:translateY(0)}}
  text{font-family:Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif}
  .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
</style>
